<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control - Letter Recognition</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- LEFT: Student Display -->
        <div class="student-display" id="studentView">
            <div class="stimulus" id="stimulus">
                <div class="instruction">Ready to begin</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <!-- RIGHT: Assessor Controls -->
        <div class="controls">
            <div class="header">
                <h2>Letter Recognition - Form 1</h2>
                <div class="timer" id="timer">00:00</div>
            </div>
            
            <div class="progress-info">
                Item <span id="current-item">0</span> of <span id="total-items">52</span>
            </div>
            
            <!-- Click Cycle States -->
            <div class="click-cycle">
                <h3>Response State</h3>
                <div class="state-buttons">
                    <button class="state-btn active" data-state="correct" id="btn-correct">
                        ✓ Correct
                    </button>
                    <button class="state-btn" data-state="incorrect" id="btn-incorrect">
                        ✗ Incorrect
                    </button>
                    <button class="state-btn" data-state="self_correct" id="btn-self-correct">
                        ↻ Self-Correct
                    </button>
                    <button class="state-btn" data-state="omission" id="btn-omission">
                        — Omission
                    </button>
                    <button class="state-btn" data-state="reset" id="btn-reset">
                        ⟲ Reset
                    </button>
                </div>
            </div>
            
            <!-- Navigation -->
            <div class="navigation">
                <button onclick="prevItem()" id="btn-prev" disabled>← Previous</button>
                <button onclick="nextItem()" id="btn-next">Next →</button>
            </div>
            
            <!-- Session Controls -->
            <div class="session-controls">
                <button onclick="stopAssessment()" id="btn-stop" class="stop-btn">
                    Stop & Score
                </button>
            </div>
            
            <!-- Session Info -->
            <div class="session-info" id="sessionInfo" style="display: none;">
                <h3>Session Status</h3>
                <div id="sessionDetails"></div>
            </div>
        </div>
    </div>
    
    <!-- Results Modal -->
    <div id="resultsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Assessment Complete!</h2>
            <div id="resultsContent"></div>
            <button onclick="closeResults()" class="close-btn">Close</button>
        </div>
    </div>
    
    <script src="js/session.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/click-cycle.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
